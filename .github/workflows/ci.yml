name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # no npm install: the skill has zero runtime dependencies (export uses the runner's Chrome)
      - run: node skills/seecode/scripts/seecode.mjs doctor
      - run: npm test

  # install the skill the way users do (npx skills add) and render with it
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the skills installer needs >= 22.20
      - run: node --test test/install.test.mjs
        env:
          SEECODE_INSTALL_TEST: '1'

  # versions are bumped by the Release workflow after merge, never in a PR
  version-unchanged:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-version-unchanged.mjs origin/${{ github.base_ref }}
